name: Nightly CI
run-name: Nightly CI full tests

on:
  schedule:
    - cron: "0 11 * * 1-5"  # Mon-Fri at 11:00 AM UTC
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{github.workflow}}-${{github.event.pull_request.number||github.ref}}

permissions: {}

jobs:
  pytest:
    if: github.repository_owner == 'quantumlib'
    permissions:
      contents: read
    runs-on: ubuntu-24.04-x64-16-core
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2.0.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev --group test
          uv pip install pytest-instafail

      - name: Run the full Pytest suite
        id: pytest-full
        env:
          # Adding xtrace makes Bash commands & scripts run with "-x".
          SHELLOPTS: ${{runner.debug == '1' && 'xtrace' || ''}}
        run: |
          if [[ "${{runner.debug}}" == "1" ]]; then
            # When debugging, print memory information continuously.
            free -hv -s 1 &
          fi
          # Get available CPU cores (fallback to 2 if nproc is unavailable).
          num_cpus=$(nproc 2>/dev/null || echo 2)
          num_procs=$(( num_cpus > 1 ? num_cpus / 2 : 1 ))
          # Use only 1/2 as many runners as cores, to avoid using too much RAM.
          uv run --no-sync check/pytest-full --instafail --durations 10 -n "${num_procs}"
