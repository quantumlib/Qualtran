name: kickmix
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
jobs:
  code_is_autoformatted:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - run: sudo apt-get install -y clang-format-21
      - run: find kickmix/src | grep "\.\(cc\|h\)$" | xargs clang-format-21 --dry-run --Werror
  generated_files_are_up_to_date:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3
      - uses: bazel-contrib/setup-bazel@e403ad507104847c3539436f64a9e9eecc73eeec # 0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:kickmix_dev_wheel
      - run: pip install bazel-bin/kickmix/kickmix-0.0.dev0-py3-none-any.whl
      - run: diff docs/kickmix/api_reference.md <(python dev_tools/kickmix/gen_api_reference.py)
  python_doctests_pass:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3
      - uses: bazel-contrib/setup-bazel@e403ad507104847c3539436f64a9e9eecc73eeec # 0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:kickmix_dev_wheel
      - run: pip install bazel-bin/kickmix/kickmix-0.0.dev0-py3-none-any.whl
      - run: ./dev_tools/kickmix/doctest_proper.py --module kickmix
  run_kickmix:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1
    - uses: bazel-contrib/setup-bazel@e403ad507104847c3539436f64a9e9eecc73eeec # 0.8.5
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true
        bazelisk-version: 1.x
    - run: bazel build kickmix:kickmix
    - run: echo "CCX q0 q1 q2" | bazel run kickmix:kickmix diagram
  run_kickmix_perf:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1
      - uses: bazel-contrib/setup-bazel@e403ad507104847c3539436f64a9e9eecc73eeec # 0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:kickmix_perf
      - run: bazel run kickmix:kickmix_perf
  run_kickmix_test:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1
    - uses: bazel-contrib/setup-bazel@e403ad507104847c3539436f64a9e9eecc73eeec # 0.8.5
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true
        bazelisk-version: 1.x
    - run: bazel build kickmix:kickmix_test
    - run: bazel test kickmix:kickmix_test
  run_kickmix_pytest:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3
      - uses: bazel-contrib/setup-bazel@e403ad507104847c3539436f64a9e9eecc73eeec # 0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:kickmix_dev_wheel
      - run: pip install bazel-bin/kickmix/kickmix-0.0.dev0-py3-none-any.whl
      - run: pip install pytest
      - run: PYTHONPATH=kickmix pytest src
  run_kickmix_pytest_no_avx:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3
      - uses: bazel-contrib/setup-bazel@e403ad507104847c3539436f64a9e9eecc73eeec # 0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:kickmix_dev_wheel --copt="-mno-avx"
      - run: pip install bazel-bin/kickmix/kickmix-0.0.dev0-py3-none-any.whl
      - run: pip install pytest
      - run: PYTHONPATH=kickmix pytest src
  run_kickmix_macos:
    strategy:
      fail-fast: false
      matrix:
        # Exercise both the portable Apple Silicon and x86 SIMD implementations.
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:all
      - run: bazel test kickmix:kickmix_test --test_output=errors
      - run: python -m pip install bazel-bin/kickmix/kickmix-0.0.dev0-py3-none-any.whl pytest
      - run: PYTHONPATH=kickmix python -m pytest src
