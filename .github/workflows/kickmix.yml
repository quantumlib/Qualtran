name: kickmix
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
permissions: {}
jobs:
  build_dist:
    runs-on: ${{ matrix.os_dist.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os_dist: [
          {os: ubuntu-24.04, dist: cp310-manylinux_x86_64},
          {os: ubuntu-24.04, dist: cp311-manylinux_x86_64},
          {os: ubuntu-24.04, dist: cp312-manylinux_x86_64},
          {os: ubuntu-24.04, dist: cp313-manylinux_x86_64},
          {os: ubuntu-24.04, dist: cp314-manylinux_x86_64},
        ]
    env:
      CIBW_BUILD: "${{ matrix.os_dist.dist }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - run: python -m pip install pybind11==2.12.0 cibuildwheel~=3.3.1 setuptools wheel
      - run: python -m cibuildwheel kickmix --print-build-identifiers
      - run: python -m cibuildwheel kickmix --output-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "dist-kickmix-${{ matrix.os_dist.os }}-${{ matrix.os_dist.dist }}"
          path: dist/*
  build_sdist:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - run: python -m pip install setuptools pybind11==2.12.0 wheel
      - run: cd kickmix && python setup.py sdist
      - run: pip install kickmix/dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "dist-kickmix-sdist"
          path: kickmix/dist/*.tar.gz
  merge_upload_artifacts:
    needs: ["build_dist", "build_sdist"]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-kickmix
          pattern: dist-kickmix-*
  code_is_autoformatted:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get install -y clang-format-21
      - run: find kickmix/src | grep "\.\(cc\|h\)$" | xargs clang-format-21 --dry-run --Werror
  generated_files_are_up_to_date:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:kickmix_dev_wheel
      - run: pip install bazel-bin/kickmix/kickmix-0.0.dev0-py3-none-any.whl
      - run: diff docs/kickmix/api_reference.md <(python dev_tools/kickmix/gen_api_reference.py)
  python_doctests_pass:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:kickmix_dev_wheel
      - run: pip install bazel-bin/kickmix/kickmix-0.0.dev0-py3-none-any.whl
      - run: ./dev_tools/kickmix/doctest_proper.py --module kickmix
  run_kickmix:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true
        bazelisk-version: 1.x
    - run: bazel build kickmix:kickmix
    - run: echo "CCX q0 q1 q2" | bazel run kickmix:kickmix diagram
  run_kickmix_perf:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:kickmix_perf
      - run: bazel run kickmix:kickmix_perf
  run_kickmix_test:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true
        bazelisk-version: 1.x
    - run: bazel build kickmix:kickmix_test
    - run: bazel test kickmix:kickmix_test
  run_kickmix_pytest:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:kickmix_dev_wheel
      - run: pip install bazel-bin/kickmix/kickmix-0.0.dev0-py3-none-any.whl
      - run: pip install pytest
      - run: PYTHONPATH=kickmix pytest kickmix/src
  run_kickmix_pytest_no_avx:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:kickmix_dev_wheel --copt="-mno-avx"
      - run: pip install bazel-bin/kickmix/kickmix-0.0.dev0-py3-none-any.whl
      - run: pip install pytest
      - run: PYTHONPATH=kickmix pytest kickmix/src
  run_kickmix_macos:
    strategy:
      fail-fast: false
      matrix:
        # Exercise both the portable Apple Silicon and x86 SIMD implementations.
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true
          bazelisk-version: 1.x
      - run: bazel build kickmix:all
      - run: bazel test kickmix:kickmix_test --test_output=errors
      - run: python -m pip install bazel-bin/kickmix/kickmix-0.0.dev0-py3-none-any.whl pytest
      - run: PYTHONPATH=kickmix python -m pytest kickmix/src
